name: Build EXE dan APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Salin HTML ke proyek desktop
        shell: bash
        run: cp app/index.html desktop/index.html
      - name: Install dan build
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfish-Windows-EXE
          path: |
            desktop/dist/*.exe
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan proyek Capacitor
        working-directory: mobile
        run: |
          npm install
          mkdir -p www
          cp ../app/index.html www/index.html
          npx cap add android
          npx cap sync android
      - name: Pasang ikon aplikasi
        working-directory: mobile
        run: |
          cp -r icons/* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfish-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
